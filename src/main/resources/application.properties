spring.application.name=edi-supervision

# --- Supervision (base cible, @Primary) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/supervision
spring.datasource.username=supervision
spring.datasource.password=supervision
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Stambia ---
stambia.datasource.url=jdbc:postgresql://localhost:5433/stambia
stambia.datasource.username=stambia
stambia.datasource.password=stambia
stambia.datasource.driver-class-name=org.postgresql.Driver

# --- Airflow DB ---
airflow.datasource.url=jdbc:postgresql://localhost:5434/airflow
airflow.datasource.username=airflow
airflow.datasource.password=airflow
airflow.docker.container-name=airflow-airflow-webserver-1

# --- Airflow REST API ---
airflow.rest.base-url=http://localhost:8085
airflow.rest.username=airflow
airflow.rest.password=airflow

# --- Flyway ---
spring.flyway.enabled=false
spring.flyway.url=jdbc:postgresql://localhost:5432/supervision
spring.flyway.user=supervision
spring.flyway.password=supervision
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=clients-cdc-consumer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=true

# --- Topic pattern Debezium Airflow ---
app.kafka.debezium.topic-pattern=airflow\..*

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Logging ---
logging.level.root=WARN
logging.level.com.supervision=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
logging.file.name=logs/edi-supervision.log

# --- Server ---
server.port=8090
